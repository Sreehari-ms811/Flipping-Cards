<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="styles.css">
		<meta charset="UTF-8">
		<title>Playing Cards</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>
	<body>
		<main class="surface">
			<div class="cards black">
				<div class="top">A</div>
				<div class="center">♠</div>
				<div class="bottom">A</div>
			</div>
			
			<div class="cards red">
				<div class="top">A</div>
				<div class="center">♥</div>
				<div class="bottom">A</div>
			</div>
			
			<div class="cards red">
				<div class="top">A</div>
				<div class="center">♦</div>
				<div class="bottom">A</div>
			</div>
			
			<div class="cards black">
				<div class="top">A</div>
				<div class="center">♣</div>
				<div class="bottom">A</div>
			</div>
		</main>
	</body>
</html>
